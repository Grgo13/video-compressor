<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画圧縮ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-zinc-800 selection:text-zinc-100">

  <main class="w-full max-w-xl bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl space-y-6">
    
    <!-- ヘッダー -->
    <header class="text-center space-y-1">
      <h1 class="text-2xl font-semibold tracking-tight text-zinc-100">動画圧縮ツール</h1>
      <p class="text-xs text-zinc-400">端末内（ブラウザ）で安全に処理されます。サーバーへのファイル送信はありません。</p>
    </header>

    <!-- ドラッグ＆ドロップエリア -->
    <section 
      id="drop-zone" 
      class="border-2 border-dashed border-zinc-700 hover:border-zinc-400 bg-zinc-900/50 hover:bg-zinc-800/50 transition-all rounded-xl p-8 text-center cursor-pointer flex flex-col items-center justify-center space-y-3"
    >
      <svg class="w-10 h-10 text-zinc-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
      </svg>
      <div class="pointer-events-none">
        <p class="text-sm font-medium text-zinc-200">動画ファイルをドラッグ＆ドロップ</p>
        <p class="text-xs text-zinc-500 mt-1">またはクリックしてファイルを選択</p>
      </div>
      <input type="file" id="file-input" accept="video/*" class="hidden" />
    </section>

    <!-- 圧縮設定エリア -->
    <section id="settings-section" class="hidden space-y-5 border-t border-zinc-800 pt-5">
      <div class="flex items-center justify-between text-xs bg-zinc-950 p-3 rounded-lg border border-zinc-800">
        <span class="text-zinc-400">選択中ファイル</span>
        <span id="file-info" class="font-mono text-zinc-200 truncate max-w-[280px]"></span>
      </div>

      <div class="space-y-1.5">
        <label for="resolution-select" class="block text-xs font-medium text-zinc-300">解像度（サイズ変更）</label>
        <select id="resolution-select" class="w-full bg-zinc-950 border border-zinc-800 text-zinc-200 text-xs rounded-lg p-2.5 focus:outline-none focus:border-zinc-500">
          <option value="original">元の解像度を維持</option>
          <option value="1080">Full HD (1080p に縮小)</option>
          <option value="720">HD (720p に縮小)</option>
          <option value="480">SD (480p に縮小)</option>
        </select>
      </div>

      <div class="space-y-2">
        <div class="flex justify-between items-center text-xs">
          <label for="crf-slider" class="font-medium text-zinc-300">圧縮度（画質調整）</label>
          <span id="crf-value" class="font-mono text-zinc-100 font-semibold bg-zinc-800 px-2 py-0.5 rounded text-[11px]">CRF 28 (標準)</span>
        </div>
        <input type="range" id="crf-slider" min="18" max="36" value="28" class="w-full h-1.5 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-zinc-100">
        <div class="flex justify-between text-[10px] text-zinc-500 font-mono">
          <span>高画質 (ファイル大)</span>
          <span>高圧縮 (ファイル小)</span>
        </div>
      </div>

      <button id="compress-btn" class="w-full py-3 bg-zinc-100 hover:bg-white text-zinc-900 font-semibold text-xs rounded-xl shadow transition-colors flex items-center justify-center space-x-2 cursor-pointer">
        <span>この設定で動画を圧縮する</span>
      </button>
    </section>

    <!-- プログレス表示 -->
    <section id="progress-section" class="hidden space-y-2 border-t border-zinc-800 pt-5">
      <div class="flex justify-between text-xs">
        <span id="status-text" class="text-zinc-400 font-medium">圧縮中...</span>
        <span id="progress-percent" class="font-mono text-zinc-200 font-semibold">0%</span>
      </div>
      <div class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-zinc-100 h-2 rounded-full w-0 transition-all duration-200"></div>
      </div>
    </section>

    <!-- 結果表示 -->
    <section id="result-section" class="hidden space-y-4 border-t border-zinc-800 pt-5">
      <div class="flex items-center justify-between">
        <span class="text-xs font-medium text-zinc-200">圧縮完了</span>
        <span id="result-size" class="text-xs font-mono text-zinc-400"></span>
      </div>
      <video id="output-video" controls class="w-full rounded-xl border border-zinc-800 bg-black max-h-[300px]"></video>
      <a id="download-btn" download="compressed.mp4" class="block w-full py-3 bg-zinc-100 hover:bg-white text-zinc-900 font-semibold text-center text-xs rounded-xl shadow transition-colors cursor-pointer">
        圧縮された動画をダウンロード
      </a>
    </section>

  </main>

  <!-- FFmpeg.wasm 本体のみ読み込み (util.jsはエラーの原因になるため破棄) -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

  <script>
    // ==========================================
    // 1. UI・イベント処理（エラーで止まらないよう最優先で実行）
    // ==========================================
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const settingsSection = document.getElementById('settings-section');
    const fileInfo = document.getElementById('file-info');
    const resolutionSelect = document.getElementById('resolution-select');
    const crfSlider = document.getElementById('crf-slider');
    const crfValue = document.getElementById('crf-value');
    const compressBtn = document.getElementById('compress-btn');
    const progressSection = document.getElementById('progress-section');
    const statusText = document.getElementById('status-text');
    const progressPercent = document.getElementById('progress-percent');
    const progressBar = document.getElementById('progress-bar');
    const resultSection = document.getElementById('result-section');
    const resultSize = document.getElementById('result-size');
    const outputVideo = document.getElementById('output-video');
    const downloadBtn = document.getElementById('download-btn');

    let selectedFile = null;
    let currentObjectUrl = null;
    let ffmpegInstance = null;

    // スライダー更新
    crfSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      crfValue.textContent = `CRF ${val} ${val == 28 ? '(標準)' : ''}`;
    });

    // クリック・ドラッグ＆ドロップ処理
    dropZone.addEventListener('click', () => fileInput.click());
    
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, e => {
        e.preventDefault();
        e.stopPropagation();
      }, false);
    });

    dropZone.addEventListener('dragover', () => dropZone.classList.add('border-zinc-400', 'bg-zinc-800/80'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-zinc-400', 'bg-zinc-800/80'));
    
    dropZone.addEventListener('drop', (e) => {
      dropZone.classList.remove('border-zinc-400', 'bg-zinc-800/80');
      if (e.dataTransfer?.files?.length > 0) handleFileSelect(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files?.length > 0) handleFileSelect(e.target.files[0]);
    });

    // ファイル選択時のUI切り替え
    function handleFileSelect(file) {
      if (!file.type.startsWith('video/')) {
        alert('動画ファイルを選択してください。');
        return;
      }
      selectedFile = file;
      fileInfo.textContent = `${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;
      
      settingsSection.classList.remove('hidden');
      resultSection.classList.add('hidden');
      progressSection.classList.add('hidden');
      
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
    }


    // ==========================================
    // 2. 内部ユーティリティ（外部ライブラリに頼らない独自実装）
    // ==========================================
    async function createBlobUrlFromFetch(url, mimeType) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Fetch failed: ${url}`);
      const blob = await response.blob();
      return URL.createObjectURL(new Blob([blob], { type: mimeType }));
    }

    async function fileToUint8Array(file) {
      const buffer = await file.arrayBuffer();
      return new Uint8Array(buffer);
    }


    // ==========================================
    // 3. FFmpegコア処理
    // ==========================================
    async function initFFmpeg() {
      if (ffmpegInstance) return ffmpegInstance;
      
      if (typeof FFmpegWASM === 'undefined') {
        throw new Error('FFmpegライブラリが読み込めませんでした。通信環境を確認してください。');
      }

      const ffmpeg = new FFmpegWASM.FFmpeg();
      
      ffmpeg.on('progress', ({ progress }) => {
        const percent = Math.max(0, Math.min(Math.round(progress * 100), 100));
        progressPercent.textContent = `${percent}%`;
        progressBar.style.width = `${percent}%`;
      });

      // SharedArrayBuffer制限を回避するため「シングルスレッド(core-st)」を使用
      const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core-st@0.12.6/dist/umd';
      const ffmpegURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd';

      statusText.textContent = '初期化エンジンをダウンロード中...';
      
      await ffmpeg.load({
        coreURL: await createBlobUrlFromFetch(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await createBlobUrlFromFetch(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
        classWorkerURL: await createBlobUrlFromFetch(`${ffmpegURL}/814.ffmpeg.js`, 'text/javascript')
      });

      ffmpegInstance = ffmpeg;
      return ffmpeg;
    }

    compressBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      // ボタンの連打防止
      compressBtn.disabled = true;
      compressBtn.classList.add('opacity-50', 'pointer-events-none');
      settingsSection.classList.add('opacity-50', 'pointer-events-none');
      progressSection.classList.remove('hidden');
      resultSection.classList.add('hidden');
      progressBar.style.width = '0%';
      progressPercent.textContent = '0%';

      const inputName = 'input.mp4';
      const outputName = 'output.mp4';

      try {
        const ffmpeg = await initFFmpeg();

        statusText.textContent = '動画を読み込み中...';
        const fileData = await fileToUint8Array(selectedFile);
        await ffmpeg.writeFile(inputName, fileData);

        statusText.textContent = '圧縮処理を実行中...';
        
        const args = ['-i', inputName];
        
        const res = resolutionSelect.value;
        if (res !== 'original') {
          args.push('-vf', `scale=-2:${res}`);
        }

        args.push(
          '-vcodec', 'libx264',
          '-crf', crfSlider.value,
          '-preset', 'ultrafast',
          '-acodec', 'aac',
          outputName
        );

        await ffmpeg.exec(args);

        statusText.textContent = 'プレビューを作成中...';
        const data = await ffmpeg.readFile(outputName);
        
        const blob = new Blob([data.buffer], { type: 'video/mp4' });
        currentObjectUrl = URL.createObjectURL(blob);

        outputVideo.src = currentObjectUrl;
        downloadBtn.href = currentObjectUrl;
        
        const extIndex = selectedFile.name.lastIndexOf('.');
        const baseName = extIndex !== -1 ? selectedFile.name.substring(0, extIndex) : selectedFile.name;
        downloadBtn.download = `${baseName}_compressed.mp4`;
        
        const newSizeMB = (blob.size / (1024 * 1024)).toFixed(2);
        const oldSizeMB = (selectedFile.size / (1024 * 1024)).toFixed(2);
        resultSize.textContent = `${oldSizeMB} MB ➔ ${newSizeMB} MB`;

        resultSection.classList.remove('hidden');
        statusText.textContent = '圧縮が完了しました';

      } catch (error) {
        console.error('エラー詳細:', error);
        alert(`圧縮中にエラーが発生しました。\n${error.message}`);
        statusText.textContent = 'エラーが発生しました';
      } finally {
        // UIのロック解除
        compressBtn.disabled = false;
        compressBtn.classList.remove('opacity-50', 'pointer-events-none');
        settingsSection.classList.remove('opacity-50', 'pointer-events-none');
        
        // 仮想ファイルの削除（メモリ解放）
        if (ffmpegInstance) {
          try { await ffmpegInstance.deleteFile(inputName); } catch (e) {}
          try { await ffmpegInstance.deleteFile(outputName); } catch (e) {}
        }
      }
    });
  </script>
</body>
</html>
